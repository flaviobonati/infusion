# Build do app Android (casca Capacitor do Infusion) e, opcionalmente, envio
# para a faixa interna do Google Play.
#
# Secrets usados (Settings > Secrets and variables > Actions):
#   ANDROID_GOOGLE_SERVICES_JSON  conteúdo do google-services.json do projeto Firebase (obrigatório para push)
#   ANDROID_KEYSTORE_BASE64       keystore de release em base64 (`base64 -w0 release.keystore`)
#   ANDROID_KEYSTORE_PASSWORD     senha do keystore
#   ANDROID_KEY_ALIAS             alias da chave dentro do keystore
#   ANDROID_KEY_PASSWORD          senha da chave
#   PLAY_SERVICE_ACCOUNT_JSON     (opcional) JSON da conta de serviço do Google Play; quando
#                                 presente, o AAB é enviado para a faixa "internal"
name: Mobile Android

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar e assinar o AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # Expressões com `secrets` não podem ir direto num `if` de step; espelhamos em env.
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dependências do Capacitor
        run: npm ci

      - name: Sincronizar projeto Android (plugins + config)
        run: npx cap sync android

      - name: Escrever google-services.json (Firebase Messaging)
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret ANDROID_GOOGLE_SERVICES_JSON ausente: as notificações push não funcionariam no app gerado."
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente: não é possível assinar o AAB."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar AAB de release (assinado)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionCode crescente a cada execução; versionName pode ser ajustado aqui.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Publicar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: infusion-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Envio para a faixa interna do Play só quando a conta de serviço estiver configurada.
      - name: Enviar para o Google Play (faixa internal)
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.infusion.bot
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
